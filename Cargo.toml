[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-wasm", "crates/sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
include_dir = "0.7"
# No default features: the engine only needs the seeded generator, and the
# OS entropy source does not build for wasm32-unknown-unknown.
rand_chacha = { version = "0.9", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# ts-rs warns about serde attributes that don't change the TypeScript shape
# (deny_unknown_fields, transparent on a newtype); silence that.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
wasm-bindgen = "0.2"

[workspace.lints.clippy]
# CLAUDE.md rule 7: errors, not panics. Tests are exempt (see clippy.toml).
unwrap_used = "deny"
