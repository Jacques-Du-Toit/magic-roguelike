[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-wasm", "crates/sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
wasm-bindgen = "0.2"

[workspace.lints.clippy]
# CLAUDE.md rule 7: errors, not panics. Tests are exempt (see clippy.toml).
unwrap_used = "deny"
